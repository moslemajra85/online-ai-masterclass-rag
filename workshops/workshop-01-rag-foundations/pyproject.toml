[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-workshop"
version = "0.1.0"
description = "A small, inspectable retrieval-augmented generation lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.68,<3", "python-dotenv>=1.0,<2"]
notebook = ["jupyterlab>=4.3,<5", "ipykernel>=6.29,<7"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
rag-lab = "rag_workshop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
